[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "input-automation-detector"
dynamic = ["version"]
description = "Scores input-telemetry sessions for the likelihood of being automated."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Razvan Chirila" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi~=0.164.0",
    "numpy~=2.1.3",
    "pydantic~=2.10.4",
    "scipy~=1.14.1",
    "uvicorn~=0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx2~=2.16.2",
    "mypy~=2.4.1",
    "pip-audit~=2.10.1",
    "pytest~=8.3.4",
    "pytest-cov~=7.1.0",
    "ruff~=0.17.5",
]
eval = [
    "scikit-learn~=1.5.2",
]

[project.urls]
Source = "https://github.com/razvanchirila/input-automation-detector"

[tool.setuptools.dynamic]
version = { attr = "iad.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
