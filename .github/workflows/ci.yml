name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install
        run: pip install -r requirements.txt -e ".[dev,eval]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install
        run: pip install -r requirements.txt -e ".[dev,eval]"
      - name: pytest
        run: pytest --cov --cov-report=term
      - name: Evaluation smoke run
        run: python eval/evaluate.py --sessions 1000

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install "pip-audit~=2.10.1"
      - name: Audit the runtime lock
        run: pip-audit --strict -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: iad:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name iad -p 8000:8000 iad:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/livez && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/readyz
          curl -fsS "http://127.0.0.1:8000/synth?kind=bot_naive&seed=1" -o s.json
          curl -fsS -X POST http://127.0.0.1:8000/score \
            -H "content-type: application/json" -d @s.json | tee r.json
          grep -q '"verdict":true' r.json
          curl -fsS http://127.0.0.1:8000/metrics | grep -q '^iad_verdicts_total'

      - name: Container logs
        if: always()
        run: docker logs iad || true

      - name: Trivy scan
        # v0.36.0. Pinned by commit: the action has no major tag, and tags are mutable.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: iad:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [docker, security]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
